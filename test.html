
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STFE - AR Product Viewer</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #E9EDF2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: transparent;
    }

    /* Hide reset button during AR */
    model-viewer:not([ar-status="not-presenting"]) .btn-reset {
      display: none;
    }

    /* Custom buttons */
    .custom-btn {
      position: absolute;
      top: 25px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .custom-btn:active {
      transform: translateY(2px);
    }

    .btn-ar {
      right: 20px;
      background-color: #007BFF;
    }

    .btn-reset {
      left: 20px;
      background-color: #545B62;
    }

  </style>
</head>

<body>

  <model-viewer
    id="product-viewer"

    src="Thermobat_v2.glb"
    ios-src="Thermobat_v2.usdz"

    alt="3D model of AAKRUTI Thermobat"

    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"

    camera-controls
    touch-action="pan-y"

    camera-orbit="0deg 70deg 95%"
    camera-target="auto auto auto"
    min-field-of-view="15deg"

    environment-image="neutral"
    exposure="1.2"
    tone-mapping="commerce"

    shadow-intensity="0.8"
    shadow-softness="0.7"

  >

    <button slot="ar-button" class="custom-btn btn-ar">
      View in AR
    </button>

    <button id="reset-btn" class="custom-btn btn-reset">
      Reset View
    </button>

  </model-viewer>

  <script>

    const viewer = document.getElementById('product-viewer');
    const resetBtn = document.getElementById('reset-btn');

    // Initial camera settings
    const initialOrbit = '0deg 70deg 95%';
    const initialTarget = 'auto auto auto';

    // Reset camera
    resetBtn.addEventListener('click', () => {

      viewer.cameraOrbit = initialOrbit;
      viewer.cameraTarget = initialTarget;

    });

  </script>

</body>
</html>
