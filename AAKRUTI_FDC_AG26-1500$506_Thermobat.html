<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STFE - AR Product Viewer</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      /* Changed from #333333 to a light neutral gray for better contrast */
      background-color: #e9ecef; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    
    model-viewer { 
      width: 100%; 
      height: 100%; 
      position: relative;
      /* Optional: subtle radial gradient to give depth */
      background: radial-gradient(#ffffff, #d6d9dc);
    }

    model-viewer:not([ar-status="not-presenting"]) .btn-reset {
      display: none;
    }

    .custom-btn {
      position: absolute;
      top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .custom-btn:active { transform: translateY(2px); }

    .btn-ar {
      right: 30px;
      background-color: #007BFF;
    }

    .btn-reset {
      left: 30px;
      background-color: #6c757d;
    }
  </style>
</head>
<body>

  <model-viewer id="product-viewer"
    src="Thermobat_v2.glb"
    ios-src="Thermobat_v2.usdz"
    alt="A 3D model of AAKRUTI_FDC_AG26-1500$506_Thermobat"
    
    /* --- VISIBILITY & LIGHTING IMPROVEMENTS --- */
    exposure="1"
    tone-mapping="commerce"
    environment-image="legacy"
    shadow-intensity="1"
    shadow-softness="0.8"
    min-camera-orbit="auto auto 5%"
    /* ------------------------------------------ */

    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    auto-rotate>
    
    <button slot="ar-button" class="custom-btn btn-ar">
      View in AR
    </button>

    <button id="reset-btn" class="custom-btn btn-reset">
      Reset View
    </button>

  </model-viewer>

  <script>
    const viewer = document.getElementById('product-viewer');
    const resetBtn = document.getElementById('reset-btn');

    resetBtn.addEventListener('click', () => {
      viewer.cameraOrbit = 'auto auto auto';
      viewer.cameraTarget = 'auto auto auto';
      viewer.fieldOfView = 'auto'; // Also resets zoom level
    });
  </script>

</body>
</html>
